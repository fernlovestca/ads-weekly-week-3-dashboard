<style>

  --luck:#2E5496;--wpc:#5B4BA8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt','Tahoma',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:20px 14px 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.12em;flex-shrink:0}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:15.5px}
.brand .bi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.3}
.topright{font-size:12.5px;color:var(--muted);text-align:right}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;background:#fff;border-radius:16px;padding:7px;margin-bottom:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);overflow-x:auto}
.tab{flex:1;min-width:150px;border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:.15s}

/* ---------- week selector ---------- */
.wsel{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}

.wbtn:hover{border-color:var(--sky)}

/* ---------- notes ---------- */
.note{font-size:12.5px;line-height:1.65;color:#3E4A5C;background:#F7F9FD;border-left:3px solid var(--sky);border-radius:0 9px 9px 0;padding:10px 14px;margin-top:11px}

.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}

.callg span{display:inline-flex;align-items:center;gap:5px}

/* ---------- checklist ---------- */
.ckbar{display:flex;align-items:center;gap:13px;background:#fff;border-radius:14px;padding:13px 17px;margin-bottom:13px;box-shadow:0 2px 10px rgba(31,56,100,.07);flex-wrap:wrap}

.ck summary{font-size:11.5px;font-weight:700;color:var(--blue);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px}
.ck summary::-webkit-details-marker{display:none}
.ck summary:before{content:"▸";transition:.2s;display:inline-block}

/* ---------- month tab ---------- */
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.mc{background:#fff;border-radius:15px;padding:16px 17px;box-shadow:0 2px 10px rgba(31,56,100,.07);border-top:3px solid var(--blue)}

.pbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}

/* ---------- platform sub-tabs ---------- */
.csel{display:flex;gap:7px;margin-bottom:15px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:11px;padding:9px 10px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;flex:1;min-width:145px;justify-content:center}

/* ============================================================
   RENDER
   ============================================================ */
function ic(n,c){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
function fmt(n,d){if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function vtxt(o){
  var neg=(typeof o.n==='number'&&o.n<0);
  return (neg?'−':'')+(o.pre||'')+fmt(Math.abs(o.n),o.dec)+(o.suf||'');
}
function cellHTML(c){
  if(c===null||c===undefined)return '<td>—</td>';
  if(typeof c==='string')return '<td>'+c+'</td>';
  return '<td>'+vtxt(c)+'</td>';
}

/* ---- การ์ด KPI ---- */
function arrow(a){return a==='up'?'▲ ':(a==='dn'?'▼ ':'● ');}
function toneCls(t){return t>0?'up':(t<0?'dn':'nt');}
function kpiRow(ch){
  if(!ch.kpi||!ch.kpi.length)return ch.kpiNote?'<div class="kpinote">'+ch.kpiNote+'</div>':'';
  var h='<div class="kpis">'+ch.kpi.map(function(k){
    var d=k.cmp
      ? '<span class="dl '+toneCls(k.cmp.tone)+'">'+arrow(k.cmp.ar)+k.cmp.txt+' <span class="from">จาก '+k.cmp.from+'</span></span>'
      : (k.note ? '<span class="dl first">'+k.note+'</span>' : '<span class="dl first">ไม่มีให้เทียบ</span>');
    return '<div class="kpi"><div class="kl">'+k.l+'</div>'+
           '<div class="kv">'+(k.pre||'')+fmt(k.n,k.dec)+(k.suf||'')+'</div><div>'+d+'</div></div>';
  }).join('')+'</div>';
  if(ch.kpiNote)h+='<div class="kpinote">'+ch.kpiNote+'</div>';
  return h;
}

/* ---- การ์ดเทียบเดือนก่อน (MoM) ---- */
function vsHTML(v){
  if(!v)return '';
  var h='<div class="sec"><div class="sh">'+ic('chart')+' '+v.label+'</div>';
  if(v.sub)h+='<div class="ss">'+v.sub+'</div>';
  h+='<div class="vs">'+v.items.map(function(i){
    var cls=toneCls(i.d), ar=arrow(i.ar);
    return '<div class="vsc"><div class="vl">'+i.l+'</div>'+
           '<div class="vr"><span class="vnow">'+i.now+'</span><span class="vold">ก.ย. '+i.old+'</span></div>'+
           '<div class="vd '+cls+'">'+ar+i.dt+'</div></div>';
  }).join('')+'</div></div>';
  return h;
}

/* ---- ตาราง ---- */
function tableGrid(t,extra){
  var h='<div class="tw"><table'+(t.minw?' style="min-width:'+t.minw+'px"':'')+'><thead><tr>'+
        t.cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
  t.rows.forEach(function(r){ h+='<tr>'+r.map(cellHTML).join('')+'</tr>'; });
  if(t.tot)h+='<tr class="tot">'+t.tot.map(cellHTML).join('')+'</tr>';
  if(extra)h+=extra;
  return h+'</tbody></table></div>';
}
var HINTCOL=null;
function hintHTML(up,dn){
  if(!up.length&&!dn.length)return '';
  return '<div class="hint">'+
     (up.length?'<span><b>ยิ่งมากยิ่งดี</b> '+up.join(' · ')+'</span>':'')+
     (dn.length?'<span><b>ยิ่งน้อยยิ่งดี</b> '+dn.join(' · ')+'</span>':'')+'</div>';
}
function hintLine(t){
  var up=[],dn=[];
  (t.dirs||[]).forEach(function(x,i){ if(x==='up')up.push(t.cols[i]); else if(x==='dn')dn.push(t.cols[i]); });
  if(!up.length&&!dn.length)return '';
  if(HINTCOL){
    up.forEach(function(x){ if(HINTCOL.up.indexOf(x)<0)HINTCOL.up.push(x); });
    dn.forEach(function(x){ if(HINTCOL.dn.indexOf(x)<0)HINTCOL.dn.push(x); });
    return '';
  }
  return hintHTML(up,dn);
}
function tableHTML(t){
  var h='<div class="sec">';
  if(t.blk){
    h+='<div class="blkh">'+(t.blk.no?'<span class="blkno">'+t.blk.no+'</span>':'')+
       '<span class="blkn">'+t.blk.n+'</span>'+
       (t.blk.t?'<span class="blkt">'+t.blk.t+'</span>':'')+
       (t.blk.b?'<span class="blkb">'+t.blk.b+'</span>':'')+'</div>';
  } else {
    h+='<div class="sh">'+ic('chart')+' '+t.label+'</div>';
  }
  if(t.sub)h+='<div class="ss">'+t.sub+'</div>';
  if(t.coll){
    var c=t.coll;
    h+='<div class="exstand"><button class="exbtn" data-ex="'+c.id+'">'+
       '<span class="exar">▸</span> '+c.label+' <span class="excount">'+c.count+'</span></button></div>'+
       '<div class="expanel2" id="ex-'+c.id+'" hidden>'+
       (c.table.sub?'<div class="ss" style="margin:0 0 9px">'+c.table.sub+'</div>':'')+
       tableGrid(c.table)+hintLine(c.table)+
       (c.table.note?'<div class="note">'+c.table.note+'</div>':'')+'</div>';
    return h+'</div>';
  }
  var extra='';
  if(t.expand){
    var e=t.expand, n=t.cols.length;
    extra='<tr class="exrow"><td colspan="'+n+'"><button class="exbtn" data-ex="'+e.id+'">'+
          '<span class="exar">▸</span> '+e.label+' <span class="excount">'+e.count+'</span></button></td></tr>'+
          '<tr class="expanel" id="ex-'+e.id+'" hidden><td colspan="'+n+'">'+
          (e.table.sub?'<div class="ss" style="margin:2px 0 9px">'+e.table.sub+'</div>':'')+
          tableGrid(e.table)+hintLine(e.table)+'</td></tr>';
  }
  h+=tableGrid(t,extra)+hintLine(t);
  if(t.note)h+='<div class="note">'+t.note+'</div>';
  return h+'</div>';
}

/* ---- โครงสร้างแคมเปญ (การ์ด) ---- */
function statStrip(arr,cls){

         '<span class="excount">'+a.kw.count+'</span></button>'+

function calHTML(c){
  if(!c)return '';
  /* เดือนของปฏิทิน · ตั้งค่าได้ที่ก้อน cal ของแต่ละช่องทาง (y = ปี ค.ศ. · mo = เดือนแบบ 0–11) · ค่าเริ่มต้นคือ พ.ย. 2026 */
  var CY=(c.y!==undefined?c.y:2026), CM=(c.mo!==undefined?c.mo:10);
  var NDAYS=new Date(CY,CM+1,0).getDate();
  var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'], first=new Date(CY,CM,1).getDay();
  var h='<div class="sec"><div class="sh">'+ic('cal')+' '+c.title+'</div><div class="ss">'+c.note+'</div><div class="calgrid">';
  DOW.forEach(function(d){h+='<div class="cdow">'+d+'</div>';});
  for(var i=0;i<first;i++)h+='<div class="cday off"></div>';
  for(var d=1;d<=NDAYS;d++){
    var ev=c.events[d]||[];
    var off=(d>c.lastData&&ev.length===0)?' off':'';
    h+='<div class="cday'+off+'"><div class="dn">'+d+'</div>'+
       ev.map(function(e){return '<div class="ev '+e.k+'">'+e.t+'</div>';}).join('')+'</div>';
  }
  h+='</div><div class="callg">'+c.legend.map(function(l){
      return '<span><i style="background:'+l[0]+'"></i>'+l[1]+'</span>';
    }).join('')+'<span style="color:#9AA5B5">วันที่จางคือยังไม่มีข้อมูล</span></div></div>';
  return h;
}

/* ---- Action Plan ของแต่ละช่องทาง ---- */
var ST_OPTS=[['todo','ยังไม่ดำเนินการ'],['doing','ดำเนินการ'],['done','เสร็จสิ้น']];
function planHTML(p,key){
  if(!p)return '';
  if(!p.rows||!p.rows.length){
    return '<div class="sec"><div class="sh">'+ic('check')+' '+p.title+'</div>'+
           '<div class="phbox">'+ic('check')+'<div><b>สัปดาห์นี้ไม่มีงาน</b><span>'+
           (p.empty||'สัปดาห์นี้ไม่มีงานที่ต้องทำ')+'</span></div></div></div>';
  }
  var d=planState(key);
  var h='<div class="sec"><div class="sh">'+ic('check')+' '+p.title+'</div>';
  if(p.note)h+='<div class="ss">'+p.note+'</div>';
  h+='<div class="tw"><table style="min-width:1120px"><thead><tr>'+
     '<th style="width:38px"></th><th style="text-align:left">งานที่ต้องทำ</th>'+
     '<th style="text-align:left">สาเหตุ</th><th style="text-align:left">ผลลัพธ์ที่คาด</th>'+
     '<th style="text-align:left;width:140px">สถานะ</th>'+
     '<th style="text-align:left;width:122px">วันที่ทำจริง</th><th style="text-align:left;width:110px">หมายเหตุ</th></tr></thead><tbody>';
  p.rows.forEach(function(row,i){
    var id=key+'-'+i, def=row[3]||{}, v=d[id]||{};
    var cur=v.st||def.st||'todo', on=cur==='done';
    var vdt=(v.dt!==undefined?v.dt:(def.dt||''));
    var vrm=(v.rm!==undefined?v.rm:(def.rm||''));
    h+='<tr><td style="text-align:center"><input type="checkbox" class="apck" data-id="'+id+'" data-key="'+key+'"'+(on?' checked':'')+'></td>'+
       '<td class="aptask'+(on?' done':'')+'">'+row[0]+'</td>'+
       '<td class="apwhy">'+(row[1]||'—')+'</td>'+
       '<td class="apres">'+(row[2]||'—')+'</td>'+
       '<td style="text-align:left"><select class="apsel st-'+cur+'" data-id="'+id+'" data-key="'+key+'">'+
         ST_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join('')+
       '</select></td>'+
       '<td style="text-align:left"><input type="date" class="apin apdate" data-f="dt" data-id="'+id+'" data-key="'+key+'" value="'+vdt+'"></td>'+
       '<td style="text-align:left"><input type="text" class="apin wide" data-f="rm" data-id="'+id+'" data-key="'+key+'" value="'+String(vrm).replace(/"/g,'&quot;')+'"></td></tr>';
  });
  h+='</tbody></table></div><div class="foot" style="padding-top:8px">สถานะที่เห็นตอนเปิดไฟล์ ฝังมากับไฟล์แล้ว ทุกคนที่เปิดจะเห็นเหมือนกัน · ถ้าแก้เพิ่มเอง จะเก็บไว้ในเบราว์เซอร์เครื่องที่แก้เท่านั้น คนอื่นไม่เห็น · อยากให้ทีมเห็นด้วย ส่งข้อความมา เดี๋ยวฝังลงไฟล์ให้</div></div>';
  return h;
}
/* ---- แผนเดือนถัดไปของแต่ละช่องทาง ---- */
function novHTML(p){
  if(!p||!p.rows||!p.rows.length)return '';
  var key=p.key, d=planState(key);
  var h='<div class="sec"><div class="sh">'+ic('check')+' '+p.title+'</div>';
  if(p.note)h+='<div class="ss">'+p.note+'</div>';
  h+='<div class="tw"><table style="min-width:1000px"><thead><tr>'+
     '<th style="width:38px"></th><th style="text-align:left;width:200px">งาน</th>'+
     '<th style="text-align:left;min-width:320px">รายละเอียด</th>'+
     '<th style="text-align:left;width:140px">สถานะ</th>'+
     '<th style="text-align:left;width:122px">วันที่ทำจริง</th><th style="text-align:left;width:110px">หมายเหตุ</th></tr></thead><tbody>';
  p.rows.forEach(function(row,i){
    var id=key+'-'+i, v=d[id]||{}, cur=v.st||'todo', on=cur==='done';
    h+='<tr><td style="text-align:center"><input type="checkbox" class="apck" data-id="'+id+'" data-key="'+key+'"'+(on?' checked':'')+'></td>'+
       '<td class="aptask'+(on?' done':'')+'">'+row[0]+'</td>'+
       '<td class="apwhy">'+(row[1]||'—')+'</td>'+
       '<td style="text-align:left"><select class="apsel st-'+cur+'" data-id="'+id+'" data-key="'+key+'">'+
         ST_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join('')+
       '</select></td>'+
       '<td style="text-align:left"><input type="date" class="apin apdate" data-f="dt" data-id="'+id+'" data-key="'+key+'" value="'+(v.dt||'')+'"></td>'+
       '<td style="text-align:left"><input type="text" class="apin" style="width:96px" data-f="rm" data-id="'+id+'" data-key="'+key+'" value="'+String(v.rm||'').replace(/"/g,'&quot;')+'"></td></tr>';
  });
  return h+'</tbody></table></div></div>';
}
function planState(key){try{return JSON.parse(localStorage.getItem('apfield-2569-11-v1-'+key)||'{}');}catch(e){return {};}}
function planSave(key,s){try{localStorage.setItem('apfield-2569-11-v1-'+key,JSON.stringify(s));}catch(e){}}
function planSet(key,id,patch){var s=planState(key); s[id]=Object.assign({},s[id]||{},patch); planSave(key,s); return s[id];}

/* ---- ช่องทาง ---- */
function channelHTML(ch){
  var h='<div class="ch"><div class="chhead">'+
    '<div class="chicon" style="background:'+ch.color+'">'+ic(ch.icon,'#fff')+'</div>'+
    '<div class="chname">'+ch.name+'<small>'+((ch.bizName&&ch.bizName!==ch.name)?ch.bizName+' · ':'')+ch.sub+'</small></div>';
  if(ch.tag)h+='<div class="chtag tg-'+ch.tag[1]+'">'+ch.tag[0]+'</div>';
  h+='</div>';

  var d='';
  HINTCOL={up:[],dn:[]};
  if(ch.igplan){
    d=igPlanHTML(ch.igplan,ch.key);
  } else {
    d=kpiRow(ch)+vsHTML(ch.vs);
    (ch.tables||[]).forEach(function(t){d+=(t.struct?structHTML(t):tableHTML(t));});
    if(ch.changes&&ch.changes.length){
      d+='<div class="sec"><div class="sh">'+ic('cal')+' สิ่งที่ปรับระหว่างสัปดาห์</div><div class="tw"><table class="chg" style="min-width:700px"><thead><tr><th style="width:92px">วันที่</th><th style="text-align:left">การเปลี่ยนแปลง</th><th style="text-align:left">ผลที่ตามมา</th></tr></thead><tbody>'+
        ch.changes.map(function(c){return '<tr><td><b>'+c[0]+'</b></td>'+
          '<td style="text-align:left;white-space:normal;font-weight:500;color:#3E4A5C">'+c[1]+'</td>'+
          '<td style="text-align:left;white-space:normal;font-weight:500;color:#3E4A5C">'+(c[2]||'—')+'</td></tr>';}).join('')+
        '</tbody></table></div></div>';
    }
    if(ch.notes&&ch.notes.length){
      d+='<div class="sec">'+ch.notes.map(function(n){return '<div class="note '+(n.k||'')+'">'+n.t+'</div>';}).join('')+'</div>';
    }
  }

  var hf=hintHTML(HINTCOL.up,HINTCOL.dn);
  HINTCOL=null;
  if(hf)d+='<div class="hintfoot">'+hf+'</div>';
  /* ---- ช่องทางที่ตั้ง nosub ไว้ จะไม่แยกแท็บย่อย แสดงเนื้อหาไหลยาวหน้าเดียว ---- */
  if(ch.nosub){
    return h+'<div class="subpane">'+d+calHTML(ch.cal)+planHTML(ch.plan,(ch.plan&&ch.plan.key)||ch.key)+novHTML(ch.nov)+'</div></div>';
  }
  var nTask=(ch.plan&&ch.plan.rows)?ch.plan.rows.length:0;
  var psub=ch.nov?'ปฏิทิน · Action Plan เดือน 11':(ch.psub||('ปฏิทิน · เช็คลิสต์ '+nTask+' งาน'));
  h+='<div class="subsel">'+
     '<button class="subbtn on" data-sub="d" data-ch="'+ch.key+'">'+
       '<span class="sic">'+ic('chart')+'</span><span>'+
       '<span class="s1">'+(ch.igplan?'แผนยิงแอด':'ข้อมูลแคมเปญ')+'</span>'+
       '<span class="s2">'+(ch.dsub||'')+'</span></span></button>'+
     '<button class="subbtn" data-sub="p" data-ch="'+ch.key+'">'+
       '<span class="sic">'+ic('check')+'</span><span>'+
       '<span class="s1">Action Plan</span>'+
       '<span class="s2">'+psub+'</span></span></button></div>'+
     '<div class="subpane" id="sub-'+ch.key+'-d">'+d+'</div>'+
     '<div class="subpane" id="sub-'+ch.key+'-p" hidden>'+calHTML(ch.cal)+planHTML(ch.plan,(ch.plan&&ch.plan.key)||ch.key)+novHTML(ch.nov)+'</div>';
  return h+'</div>';
}

/* ---- แท็บรายสัปดาห์ ---- */
var curWeek=2, curCh=0;
function flatCh(w){
  var out=[];
  w.biz.forEach(function(b){ b.ch.forEach(function(c){ var o=Object.assign({},c); o.bizName=b.name; out.push(o); }); });
  return out;
}
function weekPane(){
  var w=WEEKS[curWeek], list=flatCh(w), h='';
  if(curCh>=list.length)curCh=0;

  /* ---- ช่องทางที่ตั้ง noweek ไว้ จะไม่แบ่งรายสัปดาห์ · ใช้ข้อมูลของสัปดาห์ล่าสุดที่มี ---- */
  var cur=list[curCh];
  if(cur&&cur.noweek){
    var lastList=flatCh(WEEKS[WEEKS.length-1]);
    for(var q=0;q<lastList.length;q++){ if(lastList[q].key===cur.key){ cur=lastList[q]; break; } }
    return channelHTML(cur);
  }
  h+='<div class="wsel">'+WEEKLIST.map(function(x){
    var off=(x.i===undefined);
    return '<button class="wbtn'+(!off&&x.i===curWeek?' on':'')+(off?' off':'')+'"'+
           (off?' disabled':' data-w="'+x.i+'"')+'><div class="wt">'+x.n+'</div>'+
           (x.r?'<div class="wr">'+x.r+'</div>':'')+'</button>';
  }).join('')+'</div>';
  h+='<div class="card" style="padding:14px 18px"><div class="sh">'+ic('layers')+' '+w.n+' · '+w.full+'</div><div class="ss" style="margin-bottom:0">'+w.head+'</div></div>';
  h+=channelHTML(list[curCh]);
  return h;
}
function bindWeek(){
  document.querySelectorAll('.wbtn[data-w]').forEach(function(b){
    b.onclick=function(){var ck=(flatCh(WEEKS[curWeek])[curCh]||{}).key; curWeek=+b.getAttribute('data-w'); var nl=flatCh(WEEKS[curWeek]), ni=0; nl.forEach(function(c,i){if(c.key===ck)ni=i;}); curCh=ni; draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  document.querySelectorAll('.exbtn').forEach(function(b){
    b.onclick=function(){
      var p=document.getElementById('ex-'+b.getAttribute('data-ex'));
      var open=p.hasAttribute('hidden');
      if(open)p.removeAttribute('hidden'); else p.setAttribute('hidden','');
      b.querySelector('.exar').textContent=open?'▾':'▸';
      b.classList.toggle('on',open);
    };
  });
  document.querySelectorAll('.subbtn').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-ch');
      document.querySelectorAll('.subbtn[data-ch="'+k+'"]').forEach(function(x){
        x.classList.toggle('on', x===b);
        var pane=document.getElementById('sub-'+k+'-'+x.getAttribute('data-sub'));
        if(pane){ if(x===b)pane.removeAttribute('hidden'); else pane.setAttribute('hidden',''); }
      });
    };
  });
  document.querySelectorAll('.optbtn').forEach(function(b){
    b.onclick=function(){
      var g=b.getAttribute('data-grp');
      document.querySelectorAll('.optbtn[data-grp="'+g+'"]').forEach(function(x){
        x.classList.toggle('on', x===b);
        var pane=document.getElementById('opt-'+g+'-'+x.getAttribute('data-opt'));
        if(pane){ if(x===b)pane.removeAttribute('hidden'); else pane.setAttribute('hidden',''); }
      });
    };
  });
  document.querySelectorAll('.apck').forEach(function(b){
    b.onchange=function(){
      var key=b.getAttribute('data-key'), id=b.getAttribute('data-id');
      var st=b.checked?'done':'todo';
      planSet(key,id,{st:st});
      var tr=b.closest('tr'), sel=tr.querySelector('.apsel');
      sel.value=st; sel.className='apsel st-'+st;
      tr.querySelector('.aptask').classList.toggle('done',b.checked);
    };
  });
  document.querySelectorAll('.apsel').forEach(function(s){
    s.onchange=function(){
      var key=s.getAttribute('data-key'), id=s.getAttribute('data-id');
      planSet(key,id,{st:s.value});
      s.className='apsel st-'+s.value;
      var tr=s.closest('tr');
      tr.querySelector('.apck').checked=(s.value==='done');
      tr.querySelector('.aptask').classList.toggle('done',s.value==='done');
    };
  });
  document.querySelectorAll('.apin').forEach(function(x){
    x.oninput=function(){
      var o={}; o[x.getAttribute('data-f')]=x.value;
      planSet(x.getAttribute('data-key'),x.getAttribute('data-id'),o);
    };
  });
}

/* ---- แท็บ Monthly Summary ---- */
function monthPane(){
  var M=MONTH;
  var h='';

  /* ---- ก้อนที่ 1 · ค่าโฆษณาสะสมทุกช่องทาง ---- */
  h+='<div class="card"><div class="sh">'+ic('sum')+' '+M.spendTitle+'</div><div class="ss">'+M.spendSub+'</div>';
  h+='<div style="background:#F7F9FD;border-left:4px solid #C98A12;border-radius:0 12px 12px 0;padding:14px 17px;margin-bottom:15px">'+
     '<div style="font-size:34px;font-weight:800;color:#C98A12;letter-spacing:-1px;line-height:1.1">'+M.spendTotal+'</div></div>';

  /* ---- ตารางแยกรายสัปดาห์ ---- */
  h+='<div class="tw" style="margin-bottom:4px"><table style="min-width:640px"><thead><tr>'+
     '<th style="text-align:left">สัปดาห์</th>'+
     M.wkCols.map(function(c){return '<th>'+c+'</th>';}).join('')+
     '<th>รวมสัปดาห์</th></tr></thead><tbody>';
  M.wkRows.forEach(function(r){
    h+='<tr'+(r.wait?' class="wait"':'')+'><td style="text-align:left"><b>'+r.n+'</b>'+(r.r?'<span class="sub">'+r.r+'</span>':'')+'</td>'+
       r.v.map(function(x){return '<td>'+(x===null?(r.wait?'<span style="color:#C3CDDD">รอข้อมูล</span>':'—'):'฿'+fmt(x,2))+'</td>';}).join('')+
       '<td><b>'+(r.t===null?'<span style="color:#C3CDDD">—</span>':'฿'+fmt(r.t,2))+'</b></td></tr>';
  });
  h+='<tr class="tot"><td style="text-align:left"><b>รวมถึงตอนนี้</b></td>'+
     M.wkTotal.map(function(x){return '<td><b>฿'+fmt(x,2)+'</b></td>';}).join('')+
     '<td><b>฿'+fmt(M.wkGrand,2)+'</b></td></tr>';
  h+='</tbody></table></div></div>';

  /* ---- การ์ดแยกช่องทางของเดือนนี้ ---- */
  h+='<div class="card"><div class="sh">'+ic('sum')+' '+M.chTitle+'</div><div class="ss">'+M.chSub+'</div>';
  h+='<div class="mcards">'+M.chCards.map(function(c){
    return '<div class="mc2" style="--mc:'+c.c+'"><div class="l">'+c.n+'</div>'+
           '<div class="v">฿'+fmt(c.v,2)+'</div>'+
           '<div class="p">'+c.pct.toFixed(1)+'% ของเดือนนี้</div>'+
           '<div class="mbar"><i style="width:'+c.pct+'%"></i></div></div>';
  }).join('')+'</div></div>';

  /* ---- ค่าโฆษณาย้อนหลังรายเดือน ---- */
  h+='<div class="card"><div class="sh">'+ic('chart')+' '+M.histTitle+'</div><div class="ss">'+M.histSub+'</div>';
  h+='<div class="tw"><table style="min-width:760px"><thead><tr><th style="text-align:left">เดือน</th>'+
     M.histCols.map(function(c){return '<th>'+c+'</th>';}).join('')+
     '<th>รวมทั้งเดือน</th></tr></thead><tbody>';
  M.histRows.forEach(function(r){
    h+='<tr'+(r.now?' class="tot"':'')+'><td style="text-align:left"><b>'+r.m+'</b>'+(r.r?'<span class="sub">'+r.r+'</span>':'')+'</td>'+
       r.v.map(function(x){return '<td>'+(x===null?'<span style="color:#C3CDDD">—</span>':'฿'+fmt(x,2))+'</td>';}).join('')+
       '<td><b>฿'+fmt(r.t,2)+'</b></td></tr>';
  });
  h+='</tbody></table></div>'+(M.histNote?'<div class="note">'+M.histNote+'</div>':'')+'</div>';
  return h;
}

/* ---- มุมมอง · 0 = รายสัปดาห์ · 1 = สรุปรายเดือน ---- */
var curTab=0;
function draw(){
  /* ---- แถวบนสุด · ช่องทางทั้งหมด + Monthly Summary ---- */
  var chlist=flatCh(WEEKS[curWeek]);
  if(curCh>=chlist.length)curCh=0;
  document.getElementById('chsel').innerHTML=
    chlist.map(function(c,i){
      return '<button class="cbtn'+(curTab===0&&i===curCh?' on':'')+'" data-c="'+i+'" style="--cc:'+c.color+'">'+ic(c.icon)+' '+c.name+'</button>';
    }).join('')+
    '<button class="cbtn msum'+(curTab===1?' on':'')+'" data-m="1" style="--cc:#1F3864">'+ic('sum')+' Monthly Summary</button>';
  document.querySelectorAll('#chsel .cbtn[data-c]').forEach(function(b){
    b.onclick=function(){curTab=0;curCh=+b.getAttribute('data-c');draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  document.querySelectorAll('#chsel .cbtn[data-m]').forEach(function(b){
    b.onclick=function(){curTab=1;draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  document.getElementById('panes').innerHTML='<div class="pane on">'+(curTab===0?weekPane():monthPane())+'</div>';
  document.getElementById('globalfoot').innerHTML=
    'เดือนพฤศจิกายน 2569 ถึงสัปดาห์ที่ 3 · IG LUCK และ TikTok LUCK ยังพักการยิงแอด · <b>สัปดาห์ที่ 3 ทุกช่องทางใช้ช่วงข้อมูลเดียวกันคือ 13–19 พ.ย. (7 วัน)</b> · <b>Shopee WPC BATTERY จบแคมเปญแล้ว ไม่ได้ยิงแอดทั้งสัปดาห์</b> · <b>IG ATELIER คาบ 2 รอบ ยิงจริง 5 วัน</b> รอบเก่า 13–14 พ.ย. รอบใหม่ 17–19 พ.ย. และข้อมูลดึงจาก Ads Manager โดยตรง · ปฏิทินและ Action Plan อยู่ในแท็บย่อยของแต่ละช่องทาง';
  if(curTab===0)bindWeek();
}
draw();
